esphome:
  name: havalandirma
  friendly_name: Havalandırma
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/anilcankur-blip/orcon-esphome
      ref: main
    components: [orcon]

select:
  - platform: orcon
    name: "Orcon Modu"
    options:
      - Away
      - "1"
      - "2"
      - "3"
      - Auto
      - Boost

button:
  - platform: orcon
    name: "Orcon Eşleştirmeyi Başlat"
