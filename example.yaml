esphome:
  name: havalandirma
  friendly_name: Havalandırma
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/anilcankur-blip/orcon-esphome
      ref: feature/humidity-sensor
    components: [orcon]

button:
  - platform: orcon
    name: "Orcon Away"
  - platform: orcon
    name: "Orcon 1"
  - platform: orcon
    name: "Orcon 2"
  - platform: orcon
    name: "Orcon 3"
  - platform: orcon
    name: "Orcon Auto"
  - platform: orcon
    name: "Orcon Timer 15"
  - platform: orcon
    name: "Orcon Timer 30"
  - platform: orcon
    name: "Orcon Timer 60"
  - platform: orcon
    name: "Orcon Timer Başlat"
  - platform: orcon
    name: "Orcon Boost"
  - platform: orcon
    name: "Orcon Eşleştirmeyi Başlat"

number:
  - platform: orcon
    name: "Orcon Timer Süresi"
    min_value: 1
    max_value: 120
    step: 1

sensor:
  - platform: orcon
    name: "Orcon Nem"
