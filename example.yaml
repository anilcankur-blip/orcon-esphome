esphome:
  name: havalandirma
  friendly_name: Havalandırma
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/anilcankur-blip/orcon-esphome
      ref: main
    components: [orcon]

button:
  - platform: orcon
    name: "Orcon Away"
    mode: Away
  - platform: orcon
    name: "Orcon 1"
    mode: "1"
  - platform: orcon
    name: "Orcon 2"
    mode: "2"
  - platform: orcon
    name: "Orcon 3"
    mode: "3"
  - platform: orcon
    name: "Orcon Auto"
    mode: Auto
  - platform: orcon
    name: "Orcon Boost"
    mode: Boost
  - platform: orcon
    name: "Orcon Eşleştirmeyi Başlat"
