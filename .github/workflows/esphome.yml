name: ESPHome external component

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: python -m pip install --upgrade pip esphome

      - name: Create test Wi-Fi secrets
        run: |
          printf 'wifi_ssid: "ci-test-ssid"\nwifi_password: "ci-test-password"\n' > secrets.yaml

      - name: Validate GitHub external-component example
        run: esphome config example.yaml

      - name: Validate local ESPHome configuration
        run: esphome config tests/compile.yaml

      - name: Compile ESP32 firmware
        run: esphome compile tests/compile.yaml
