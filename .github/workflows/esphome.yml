name: ESPHome external component

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: python -m pip install --upgrade pip esphome

      - name: Validate ESPHome configuration
        run: esphome config tests/compile.yaml

      - name: Compile ESP32 firmware
        run: esphome compile tests/compile.yaml
