esphome:
  name: orcon-ci-test
  friendly_name: Orcon CI Test
  min_version: 2026.4.0

esp32:
  variant: esp32
  framework:
    type: arduino

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: "test-ssid"
  password: "test-password"

external_components:
  - source:
      type: local
      path: ../components
    components: [orcon]

button:
  - platform: orcon
    name: "Orcon Away"
    mode: Away
  - platform: orcon
    name: "Orcon 1"
    mode: "1"
  - platform: orcon
    name: "Orcon 2"
    mode: "2"
  - platform: orcon
    name: "Orcon 3"
    mode: "3"
  - platform: orcon
    name: "Orcon Auto"
    mode: Auto
  - platform: orcon
    name: "Orcon Boost"
    mode: Boost
  - platform: orcon
    name: "Orcon Pairing"
