esphome:
  name: orcon-ci-test
  friendly_name: Orcon CI Test
  min_version: 2026.4.0

esp32:
  variant: esp32
  framework:
    type: arduino

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: "test-ssid"
  password: "test-password"

external_components:
  - source:
      type: local
      path: ../components
    components: [orcon]

select:
  - platform: orcon
    name: "Orcon Mode"
    options:
      - Away
      - "1"
      - "2"
      - "3"
      - Auto
      - Boost

button:
  - platform: orcon
    name: "Orcon Pairing"
